[project]
name = "mcp-auditor"
version = "0.1.0"
description = "Static security auditor for MCP (Model Context Protocol) servers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
]

[project.scripts]
mcp-auditor = "mcp_auditor.cli:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]