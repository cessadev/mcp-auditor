services:
  dev:
    build: .
    command: sleep infinity
    volumes:
      - .:/app
      - venv:/opt/venv
      - uv-cache:/root/.cache/uv

  # Phase 1 of auditing third-party servers: has network, only installs wheels into /targets
  prepare:
    build: .
    profiles: ["prepare"]
    working_dir: /targets
    volumes:
      - targets:/targets
      - uv-cache:/root/.cache/uv

  # Phase 2: no network, read-only, runs and audits the prepared server
  sandbox:
    build: .
    profiles: ["sandbox"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 128
    tmpfs: ["/tmp"]
    working_dir: /app
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - .:/app:ro
      - venv:/opt/venv:ro
      - targets:/targets:ro

volumes:
  venv:
  uv-cache:
  targets: